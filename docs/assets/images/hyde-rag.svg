<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc">
  <title id="title">HyDE RAG</title>
  <desc id="desc">The model writes a made-up answer, partly invented. Keyword search with it finds new_starters.md; the question itself finds nothing. The lists are fused, reranked against the question, and the model answers from the real chunk: laptop, badge and headset.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .h { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .cls { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0e7490; }
      .ex { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; white-space: pre; }
      .sm { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; white-space: pre; }
      .tag { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #b45309; }
      .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .big { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .keep { fill: #15803d; font-weight: 700; }
      .drop { fill: #94a3b8; }
      .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; white-space: pre; }
      .cm { fill: #94a3b8; }
      .st { fill: #86efac; }
      .q { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .search { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .gen { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .child { fill: #cffafe; stroke: #06b6d4; stroke-width: 1; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .made { fill: #fef3c7; stroke: #d97706; stroke-width: 1; stroke-dasharray: 4 3; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .hl { fill: none; stroke: #f97316; stroke-width: 3; opacity: 0; animation: glow 10s infinite; }
      .grow { animation: grow 10s infinite; transform-box: fill-box; transform-origin: top; }
      @keyframes dash { to { stroke-dashoffset: -11; } }
      @keyframes glow { 0% { opacity: 0; } 2% { opacity: 1; } 18% { opacity: 1; } 21% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes grow { 0%, 59% { transform: scaleY(0.25); } 66%, 100% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .flow, .hl, .grow { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="619" rx="16"/>
  <text class="title" x="30" y="44">HyDE RAG: search with a made-up answer</text>
  <text class="sub" x="30" y="66">An answer reads like the documents; only real chunks reach the model. rag_type="hyde"</text>

  <rect class="q" x="30" y="84" width="900" height="44" rx="10"/>
  <text class="big" x="48" y="112">Question:  “What gear does a newcomer receive?”</text>
  <text class="note" x="912" y="112" text-anchor="end">RETRIEVER=bm25 (exact words)</text>

  <path class="flow" d="M135 130 V154" marker-end="url(#arrow)"/>
  <path class="flow" d="M242 290 H256" marker-end="url(#arrow)"/>
  <path class="flow" d="M472 290 H486" marker-end="url(#arrow)"/>
  <path class="flow" d="M702 290 H716" marker-end="url(#arrow)"/>
  <path class="flow" d="M825 424 V448" marker-end="url(#arrow)"/>
  <rect class="llm" x="30" y="160" width="210" height="262" rx="10"/>
  <text class="h" x="44" y="186">1 · Write a made-up</text>
  <text class="h" x="44" y="204">answer</text>
  <text class="cls" x="44" y="224">HYDE_PROMPT → LLM</text>
  <rect class="made" x="42" y="236" width="186" height="118" rx="6"/>
  <text class="sm" x="50" y="254">New employees are</text>
  <text class="sm" x="50" y="270">provided with a standard</text>
  <text class="sm" x="50" y="286">starter kit … a laptop,</text>
  <text class="sm" x="50" y="302">a mobile phone, a</text>
  <text class="sm" x="50" y="318">water bottle … a</text>
  <text class="sm" x="50" y="334">polo shirt.</text>
  <text class="note" x="44" y="380">partly invented: only</text>
  <text class="note" x="44" y="398">used to search</text>

  <rect class="search" x="260" y="160" width="210" height="262" rx="10"/>
  <text class="h" x="274" y="186">2 · Search twice</text>
  <text class="cls" x="274" y="206">BM25Retriever</text>
  <text class="tag" x="274" y="234">MADE-UP ANSWER</text>
  <text class="ex" x="274" y="254">new_starters.md <tspan class="keep">1.00</tspan></text>
  <text class="ex" x="274" y="272">lost_device.md  0.83</text>
  <text class="ex" x="274" y="290">+ 2 more files</text>
  <text class="tag" x="274" y="322">QUESTION</text>
  <text class="ex drop" x="274" y="342">nothing: no word in</text>
  <text class="ex drop" x="274" y="360">common with the files</text>
  <text class="note" x="274" y="398">same words as the docs</text>

  <rect class="search" x="490" y="160" width="210" height="262" rx="10"/>
  <text class="h" x="504" y="186">3 · Fuse + rerank</text>
  <text class="cls" x="504" y="206">RRF, then top_n=2</text>
  <text class="note" x="504" y="236">lists fused by rank;</text>
  <text class="note" x="504" y="254">reranked against the</text>
  <text class="note" x="504" y="272">original question</text>
  <text class="ex" x="504" y="306">new_starters.md <tspan class="keep">✓</tspan></text>
  <text class="ex" x="504" y="326">lost_device.md  <tspan class="keep">✓</tspan></text>
  <text class="note" x="504" y="398">real chunks only</text>

  <rect class="gen" x="720" y="160" width="210" height="262" rx="10"/>
  <text class="h" x="734" y="186">4 · Generate</text>
  <text class="cls" x="734" y="206">GroundedGenerator → LLM</text>
  <text class="sm" x="734" y="236"><tspan class="tag">QUESTION</tspan> the original</text>
  <text class="sm" x="734" y="258"><tspan class="tag">CONTEXT</tspan> the 2 real chunks</text>
  <text class="sm" x="734" y="290">On your first day the</text>
  <text class="sm" x="734" y="306">service desk hands out</text>
  <text class="sm" x="734" y="322">your laptop, badge and</text>
  <text class="sm" x="734" y="338">headset.</text>
  <text class="note" x="734" y="398">from new_starters.md</text>

  <rect class="gen" x="30" y="454" width="900" height="64" rx="10"/>
  <text class="big" x="48" y="480">Answer: “On your first day the service desk hands out your laptop, badge and headset.”</text>
  <text class="note" x="48" y="502">The made-up water bottle and polo shirt never reach the answer. Simple RAG with bm25 finds nothing for this question.</text>
  <rect class="hl" x="30" y="84" width="900" height="44" rx="10" style="animation-delay:0s"/>
  <rect class="hl" x="30" y="160" width="210" height="262" rx="10" style="animation-delay:2s"/>
  <rect class="hl" x="260" y="160" width="210" height="262" rx="10" style="animation-delay:4s"/>
  <rect class="hl" x="490" y="160" width="210" height="262" rx="10" style="animation-delay:6s"/>
  <rect class="hl" x="720" y="160" width="210" height="262" rx="10" style="animation-delay:8s"/>

  <rect x="30" y="534" width="900" height="66" rx="12" fill="#0f172a"/>
  <text class="code" x="52" y="562">rag = RAGTitan(rag_type=<tspan class="st">"hyde"</tspan>, settings={<tspan class="st">"retriever"</tspan>: <tspan class="st">"bm25"</tspan>, <tspan class="st">"hyde_with_question"</tspan>: True})</text>
  <text class="code" x="52" y="584">rag.index(files); rag.ask(<tspan class="st">"What gear does a newcomer receive?"</tspan>)   <tspan class="cm"># 2 LLM calls</tspan></text>
</svg>
