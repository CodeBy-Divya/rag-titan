# Runs lint and tests on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run every Python version even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  # Chroma and Qdrant are optional extras: the job above skips their tests,
  # this one installs them and runs every store through the same checks
  vector-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,chroma,qdrant]"
      - run: pytest tests/test_chroma_qdrant_stores.py tests/test_sqlite_store.py tests/test_store_rules.py -rs

  # the cross-encoder reranker is an optional extra ([rerank]): install it with the
  # small CPU build of torch and score real (question, chunk) pairs with the model
  rerank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,rerank]"
      - run: pytest tests/test_precision_rerankers.py -rs
